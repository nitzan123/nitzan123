[package]
name = "prism-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Catalog, metadata, thumbnail and non-destructive develop engine for Prism Studio"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
kamadak-exif = "0.6"
rawloader = "0.37"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
thiserror = "1"
blake3 = "1"
ab_glyph = "0.2"
quick-xml = "0.36"
tract-onnx = "0.23"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
unicode-bidi = "0.3"
# Native roots so corporate/system CAs are honoured.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }

[dev-dependencies]
tempfile = "3"
