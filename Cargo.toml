[workspace]
resolver = "2"
members = ["crates/prism-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev.package."*"]
opt-level = 2

# Image processing is unusably slow unoptimised; keep debug builds snappy.
[profile.dev.package.prism-core]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
